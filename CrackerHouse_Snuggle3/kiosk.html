<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>현장 대기 키오스크 — 크래커하우스 X 스너글</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=DM+Mono:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'SheLeeOkSun';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_ten@1.0/Her-Leeoksun.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    /* ══════════════════════
       DESIGN TOKENS (Main Page Sync)
    ══════════════════════ */
    :root {
      --red:      #BC453C;
      --clay:     #BF6E50;
      --orange:   #F25C05;
      --espresso: #594335;
      --blue:     #517EA6;
      --beige:    #EBE4D8;
      --cream:    #F7F2EA;
      --dark:     #1A1208;
      --dark2:    #231609;
      --card:     #2E1D0F;
      --white:    #FFFFFF;
      --muted:    #C4B9AE;
      --ff-serif: 'SheLeeOkSun', 'Playfair Display', serif;
      --ff-mono:  'DM Mono', monospace;
      --ff-sans:  'Noto Sans KR', sans-serif;
      --tr:       all 0.25s ease;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--ff-sans);
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Kiosk Card Frame */
    .kiosk-wrapper {
      width: 100%;
      max-width: 480px;
      background: var(--dark2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 6px solid var(--orange);
      border-radius: 12px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.45);
      padding: 48px 40px;
      text-align: center;
      animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .kiosk-eyebrow {
      font-family: var(--ff-mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--clay);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .kiosk-title {
      font-family: var(--ff-serif);
      font-size: 32px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .kiosk-title em {
      font-style: italic;
      color: var(--orange);
    }

    .kiosk-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 36px;
    }

    /* Form Controls */
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-family: var(--ff-mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--clay);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: var(--white);
      font-size: 14px;
      outline: none;
      transition: var(--tr);
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--orange);
      background: rgba(255, 255, 255, 0.08);
    }

    .form-select option {
      background: var(--dark2);
      color: var(--white);
    }

    /* Kiosk Buttons */
    .kiosk-btn {
      width: 100%;
      padding: 16px 24px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: var(--tr);
      margin-bottom: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .kiosk-btn--primary {
      background: var(--orange);
      color: var(--white);
    }

    .kiosk-btn--primary:hover {
      background: var(--red);
      transform: translateY(-1px);
    }

    .kiosk-btn--secondary {
      background: transparent;
      color: var(--white);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
    }

    .kiosk-btn--secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--white);
    }

    .kiosk-link {
      font-size: 12px;
      color: var(--clay);
      display: inline-block;
      margin-top: 20px;
      text-decoration: underline;
    }

    .kiosk-link:hover {
      color: var(--orange);
    }

    /* Number Display */
    .kiosk-number-box {
      background: var(--card);
      border: 1.5px dashed var(--clay);
      padding: 28px 20px;
      border-radius: 8px;
      margin: 28px 0;
    }

    .kiosk-number {
      font-size: 64px;
      font-weight: 900;
      color: var(--orange);
      line-height: 1;
      margin-bottom: 8px;
      font-family: var(--ff-mono);
    }

    /* Result Details */
    .kiosk-detail-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 0;
      font-size: 14px;
    }

    .kiosk-detail-row span:first-child {
      color: var(--muted);
    }

    .kiosk-detail-row span:last-child {
      font-weight: 700;
    }
  
    /* --- TOP BUTTON --- */
    .top-btn {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 52px;
      height: 52px;
      background: var(--orange);
      color: var(--white);
      border: 2px solid var(--clay);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--ff-mono);
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 9999;
    }
    .top-btn.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .top-btn:hover {
      background: var(--red);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 8px 24px rgba(235, 69, 60, 0.4);
    }
  </style>
</head>
<body>

<div class="kiosk-wrapper">

  <!-- 1. MAIN SCREEN -->
  <div id="kioskMain">
    <div class="kiosk-eyebrow">// onsite kiosk</div>
    <h1 class="kiosk-title">KRACKER × SNUGGLE<br/><em>포근한 세탁소</em></h1>
    <p class="kiosk-desc">
      스타필드 빌리지 팝업스토어 현장 입장을 환영합니다.<br/>
      원활한 관람을 위해 대기 등록을 완료해 주세요.
    </p>
    <button class="kiosk-btn kiosk-btn--primary" onclick="showScreen('kioskRegisterScreen')">🧺 &nbsp;현장 대기 등록하기</button>
    <button class="kiosk-btn kiosk-btn--secondary" onclick="showScreen('kioskQueryScreen')">🔍 &nbsp;내 대기 순번 조회</button>
    
    <div>
      <a href="index.html" class="kiosk-link">← 웹사이트 홈으로 가기</a>
    </div>
  </div>

  <!-- 2. REGISTER SCREEN -->
  <div id="kioskRegisterScreen" style="display: none;">
    <div class="kiosk-eyebrow">// register</div>
    <h1 class="kiosk-title" style="font-size: 26px; margin-bottom: 24px;">현장 대기 등록</h1>
    
    <form id="kioskRegisterForm">
      <div class="form-group">
        <label for="kioskName">성함</label>
        <input type="text" id="kioskName" class="form-input" placeholder="성함을 입력하세요" required />
      </div>
      <div class="form-group">
        <label for="kioskPhone">휴대폰 번호</label>
        <input type="tel" id="kioskPhone" class="form-input" placeholder="호출 알림용 (예: 01012345678)" required />
      </div>
      <div class="form-group">
        <label for="kioskPeople">방문 인원수</label>
        <select id="kioskPeople" class="form-select">
          <option value="1">1명</option>
          <option value="2">2명</option>
          <option value="3">3명</option>
          <option value="4">4명 이상</option>
        </select>
      </div>
      
      <div style="display: flex; gap: 12px; margin-top: 32px;">
        <button type="button" class="kiosk-btn kiosk-btn--secondary" style="flex: 1; margin-bottom: 0;" onclick="showScreen('kioskMain')">취소</button>
        <button type="submit" class="kiosk-btn kiosk-btn--primary" style="flex: 1.5; margin-bottom: 0;">등록 완료</button>
      </div>
    </form>
  </div>

  <!-- 3. SUCCESS SCREEN -->
  <div id="kioskSuccessScreen" style="display: none;">
    <div class="kiosk-eyebrow">// success</div>
    <h1 class="kiosk-title" style="font-size: 26px;">대기 등록 완료</h1>
    <p class="kiosk-desc" style="margin-bottom: 0;">순서가 되면 카카오톡/알림톡으로 알려 드립니다.</p>
    
    <div class="kiosk-number-box">
      <p style="color: var(--muted); font-size: 12px; margin-bottom: 8px; font-family: var(--ff-mono);">YOUR WAITING NUMBER</p>
      <div class="kiosk-number" id="issuedNumber">0</div>
      <p style="font-weight: 700; font-size: 15px;"><span id="issuedName">-</span> 님</p>
    </div>

    <button class="kiosk-btn kiosk-btn--primary" onclick="showScreen('kioskMain')">확인 완료</button>
  </div>

  <!-- 4. QUERY SCREEN -->
  <div id="kioskQueryScreen" style="display: none;">
    <div class="kiosk-eyebrow">// inquiry</div>
    <h1 class="kiosk-title" style="font-size: 26px; margin-bottom: 24px;">대기 상태 조회</h1>
    
    <form id="kioskQueryForm">
      <div class="form-group">
        <label for="kioskQueryPhone">휴대폰 번호</label>
        <input type="tel" id="kioskQueryPhone" class="form-input" placeholder="등록하신 번호를 입력하세요" required />
      </div>
      
      <div style="display: flex; gap: 12px; margin-top: 32px;">
        <button type="button" class="kiosk-btn kiosk-btn--secondary" style="flex: 1; margin-bottom: 0;" onclick="showScreen('kioskMain')">이전</button>
        <button type="submit" class="kiosk-btn kiosk-btn--primary" style="flex: 1.5; margin-bottom: 0;">조회하기</button>
      </div>
    </form>
  </div>

  <!-- 5. QUERY RESULT SCREEN -->
  <div id="kioskQueryResultScreen" style="display: none;">
    <div class="kiosk-eyebrow">// live status</div>
    <h1 class="kiosk-title" style="font-size: 26px; margin-bottom: 24px;">실시간 대기 현황</h1>

    <div style="background: rgba(0,0,0,0.15); padding: 10px 20px; border-radius: 6px; margin-bottom: 28px;">
      <div class="kiosk-detail-row">
        <span>등록 이름</span>
        <span id="queryName">-</span>
      </div>
      <div class="kiosk-detail-row">
        <span>대기 번호</span>
        <span style="color: var(--orange);" id="queryNumber">-</span>
      </div>
      <div class="kiosk-detail-row" style="border-bottom: none;">
        <span>내 앞 대기 팀수</span>
        <span style="color: var(--clay);" id="queryAhead">- 팀</span>
      </div>
    </div>

    <button class="kiosk-btn kiosk-btn--primary" onclick="showScreen('kioskMain')">돌아가기</button>
  </div>

</div>

<script>
  function showScreen(id) {
    const screens = ['kioskMain', 'kioskRegisterScreen', 'kioskSuccessScreen', 'kioskQueryScreen', 'kioskQueryResultScreen'];
    screens.forEach(s => {
      const el = document.getElementById(s);
      if (el) el.style.display = (s === id) ? 'block' : 'none';
    });
  }
</script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>

  <!-- SCROLL TO TOP BUTTON -->
  <button class="top-btn" id="scrollTopBtn" title="Go to top">&#8593;</button>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var topBtn = document.getElementById("scrollTopBtn");
      if (topBtn) {
        window.addEventListener("scroll", function() {
          var scrollPos = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop;
          if (scrollPos > 300) {
            topBtn.classList.add("visible");
          } else {
            topBtn.classList.remove("visible");
          }
        });
        topBtn.addEventListener("click", function() {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
    });
  </script>
</body>

</html>
