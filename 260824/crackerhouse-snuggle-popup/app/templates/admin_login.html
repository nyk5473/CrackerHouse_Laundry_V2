<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 - 크래커하우스 X 스너글</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar"><a class="logo" href="/">CRACKER<span class="x">X</span>SNUGGLE</a></header>
  <section class="section">
    <h2 class="section-title">관리자 로그인</h2>
    <p class="muted">팝업 운영진 전용 페이지입니다.</p>
    <div id="login-alert"></div>
    <form id="login-form" class="card"><div class="card-body">
      <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">로그인</button>
    </div></form>
    <p class="muted" style="margin-top:10px;">데모 계정: admin / popup1234! (seed.py 참고)</p>
  </section>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('login-alert');
  alertBox.innerHTML = '';
  const payload = {
    username: document.getElementById('username').value.trim(),
    password: document.getElementById('password').value,
  };
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    const data = await res.json();
    alertBox.innerHTML = `<div class="alert alert-error">${data.detail || '로그인에 실패했습니다.'}</div>`;
    return;
  }
  window.location.href = '/admin';
});
</script>
</body>
</html>
